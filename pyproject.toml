[project]
name = "marketmind-agent"
version = "0.1.0"
description = "Engineering-focused e-commerce competitor research Agent with async task orchestration, persistent Agent state, crawler pipeline, and RAG."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.4",
    "celery[redis]>=5.4.0",
    "fastapi>=0.115.12",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.9.1",
    "playwright>=1.60.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.34.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "ruff>=0.11.11",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
