services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketmind}
      POSTGRES_DB: ${POSTGRES_DB:-marketmind}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketmind} -d ${POSTGRES_DB:-marketmind}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment: &backend-env
      APP_ENV: compose
      APP_NAME: MarketMind Comment Intelligence API
      API_PREFIX: /api
      LOG_LEVEL: INFO
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-marketmind}:${POSTGRES_PASSWORD:-marketmind}@postgres:5432/${POSTGRES_DB:-marketmind}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TASK_STATUS_REDIS_URL: redis://redis:6379/3
      TASK_STATUS_TTL_SECONDS: "86400"
      CRAWLER_ARTIFACT_DIR: /app/data/artifacts/crawler
      CRAWLER_SAVE_HTML_ARTIFACT: "true"
      CRAWLER_CAPTURE_SCREENSHOT: "false"
      DEFAULT_LOCAL_USER_ID: usr_local
      DEFAULT_LOCAL_USER_EMAIL: ""
      DEFAULT_LOCAL_PROJECT_ID: prj_default
      DEFAULT_LOCAL_PROJECT_NAME: Default Project
      MODEL_PROVIDER: openai-compatible
      MODEL_NAME: gpt-5.4-mini
      REPORT_MODEL_NAME: gpt-5.5
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSIONS: "1536"
      EMBEDDING_API_BASE_URL: ${EMBEDDING_API_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-15}
      EMBEDDING_PROVIDER_FALLBACK_ENABLED: ${EMBEDDING_PROVIDER_FALLBACK_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    command: uv run alembic upgrade head

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      <<: *backend-env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - crawler_artifacts:/app/data/artifacts/crawler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      <<: *backend-env
    volumes:
      - crawler_artifacts:/app/data/artifacts/crawler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uv run celery -A app.worker.celery_app.celery_app worker --loglevel=INFO --queues=marketmind --concurrency=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_USE_MOCKS: "false"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_USE_MOCKS: "false"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  crawler_artifacts:
